title:
  type: str
  default: 'Debugging 50'
  description: 'Title to show in layout'
crash_rate:
  type: float
  default: 0.5
  description: 'Rate at which simulated crashes will be produced on update'
high_priority_rate:
  type: float
  default: 0.2
  description: 'Rate at which plugin will rise to "high priority" status'
max_sleep_time:
  type: int
  default: 20
  range: [1, 120]
  description: 'Maximum amount of time plugin will stop responding to simulate slow response'
